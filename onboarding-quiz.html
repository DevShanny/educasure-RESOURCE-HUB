<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EducaSure Learner Onboarding Quizzes</title>
<style>
:root{--navy:#0b2142;--navy2:#0d354e;--gold:#e5a93b;--goldbg:#fdf6e8;--grey:#f2f4f8;--ink:#1f2937;--muted:#5b6474;--line:#d9dee7;--ok:#1d6b46;--okbg:#e8f5ee;--bad:#a33a2c;--badbg:#fbeceA}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 Cambria,Caladea,Georgia,serif}
.sans,button,.eyebrow,.pill{font-family:Inter,"Segoe UI",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header img{height:34px;display:block;margin:6px 0 14px}
.banner{background:linear-gradient(115deg,#0b2142,#0d354e 60%,#123f5c);color:#fff;padding:20px 20px 18px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.banner h1{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:26px;margin:6px 0 4px;line-height:1.2}
.banner p{margin:0;color:#d6deea;font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:3px}
.tile{background:var(--navy);color:#fff;padding:9px 12px;font-family:Inter,"Segoe UI",Arial,sans-serif}
.tile .k{font-size:10px;letter-spacing:.1em;color:var(--gold);font-weight:700;text-transform:uppercase}
.tile .v{font-size:18px;font-weight:700}
h2{color:var(--navy);font-size:21px;margin:22px 0 10px;padding-left:10px;border-left:4px solid var(--gold);line-height:1.25}
h2 .n{color:var(--gold);margin-right:6px}
.name{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.name label{font-family:Inter,"Segoe UI",Arial,sans-serif;font-weight:600;color:var(--navy);font-size:14px}
.name input{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);font:inherit;border-radius:2px}
.list{display:grid;gap:8px;margin:10px 0}
.mod{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--grey);border:0;border-left:4px solid var(--navy);padding:12px 14px;cursor:pointer;font:inherit;color:var(--ink)}
.mod:hover{background:#e8ecf3}
.mod .num{font-family:Inter,Arial,sans-serif;font-weight:700;color:var(--gold);font-size:18px;min-width:26px}
.mod .t{flex:1;font-size:16px}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:2px;white-space:nowrap}
.pill.todo{background:#fff;color:var(--muted);border:1px solid var(--line)}
.pill.pass{background:var(--okbg);color:var(--ok)}
.pill.fail{background:#fbecea;color:var(--bad)}
.box{background:var(--goldbg);border-left:4px solid var(--gold);padding:12px 14px;margin:14px 0}
.box .t{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;color:#b77d14;text-transform:uppercase;margin-bottom:4px}
.q{margin:16px 0 22px}
.q .qh{font-family:Inter,Arial,sans-serif;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.q .qt{font-size:18px;color:var(--navy);font-weight:700;margin:2px 0 10px;line-height:1.35}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:11px 12px;margin:6px 0;cursor:pointer;font:inherit;color:var(--ink);border-radius:2px}
.opt .l{font-family:Inter,Arial,sans-serif;font-weight:700;color:var(--navy);min-width:18px}
.opt:hover{border-color:var(--navy)}
.opt.sel{border:2px solid var(--navy);background:#f5f7fb;padding:10px 11px}
.opt.right{border:2px solid var(--ok);background:var(--okbg);padding:10px 11px}
.opt.wrong{border:2px solid var(--bad);background:#fbecea;padding:10px 11px}
.opt[disabled]{cursor:default}
.fb{font-size:15px;margin-top:6px;padding:8px 12px;border-left:4px solid var(--ok);background:var(--okbg)}
.fb.no{border-left-color:var(--bad);background:#fbecea}
.fb b{font-family:Inter,Arial,sans-serif}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.prog{font-family:Inter,Arial,sans-serif;font-size:13px;color:var(--muted)}
.btn{background:var(--navy);color:#fff;border:0;padding:11px 18px;font-weight:600;font-size:15px;cursor:pointer;border-radius:2px}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.result{background:linear-gradient(115deg,#0b2142,#0d354e);color:#fff;padding:20px;margin:14px 0}
.result .score{font-family:Inter,Arial,sans-serif;font-size:40px;font-weight:700}
.result .verdict{font-family:Inter,Arial,sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.result.ok .verdict{color:#7fd6a6}.result.no .verdict{color:#ffb4a8}
.result p{color:#d6deea;margin:6px 0 0}
.cert{border:2px solid var(--navy);padding:22px;text-align:center;margin:16px 0;outline:6px solid var(--goldbg)}
.cert img{height:40px;margin-bottom:8px}
.cert h3{font-family:Inter,Arial,sans-serif;color:var(--navy);margin:6px 0;font-size:22px}
.cert .nm{font-size:24px;color:var(--navy);font-weight:700;border-bottom:2px solid var(--gold);display:inline-block;padding:0 14px 4px;margin:8px 0}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:28px;padding-top:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
a{color:var(--navy)}
.hide{display:none}
@media print{.bar,.noprint{display:none}}
</style></head>

const MODULES=[{"title": "Who EducaSure is and who funds you", "q": [{"t": "What is EducaSure?", "o": ["A government department", "An accredited training provider that delivers your learnership", "A recruitment agency", "A SETA"], "a": 1, "w": "EducaSure is the accredited provider that delivers the training."}, {"t": "Who usually pays for your learnership?", "o": ["You pay monthly fees", "EducaSure pays from its own profits", "A SETA grant, through the employer you are placed with", "SARS"], "a": 2, "w": "A SETA grant pays for the place, usually through the employer."}, {"t": "What is a SETA?", "o": ["A Sector Education and Training Authority that funds and oversees skills training in an industry", "A type of qualification", "A bank", "A trade union"], "a": 0, "w": "SETAs fund and oversee skills training for their sector."}, {"t": "What does the QCTO do?", "o": ["Pays your stipend", "Runs your virtual classroom", "Hires facilitators", "Oversees occupational qualifications and accredits providers like EducaSure"], "a": 3, "w": "The QCTO oversees occupational qualifications and accredits providers."}, {"t": "What is SetaLink?", "o": ["Another name for your SETA", "EducaSure's sister company that helps employers with SETA grants and levies", "The app you use for classes", "A learner support line"], "a": 1, "w": "SetaLink is the SDF arm: levies, WSP/ATR and grant applications."}, {"t": "Because your place is funded, what is expected of you?", "o": ["Nothing — it is free", "Only to attend the last week", "To attend, submit your work and finish, because the funding depends on it", "To pay back the grant if you pass"], "a": 2, "w": "The grant pays for delivery. Drop-outs put funding at risk."}, {"t": "Your learnership combines two things. What are they?", "o": ["Classroom learning and workplace experience", "Sport and study", "Online games and tests", "Two separate degrees"], "a": 0, "w": "A learnership is structured learning plus workplace experience."}, {"t": "Who is your employer during the learnership?", "o": ["The SETA", "EducaSure", "The QCTO", "The company you are placed with, as set out in your learnership agreement"], "a": 3, "w": "The host employer signs the agreement with you."}, {"t": "What do you receive if you complete the learnership successfully?", "o": ["A certificate of attendance only", "A nationally recognised qualification", "A permanent job, guaranteed", "A refund"], "a": 1, "w": "Completion leads to a registered, nationally recognised qualification."}, {"t": "Why must you finish this onboarding course before your first class?", "o": ["It is optional", "You are not enrolled until you finish it", "It replaces your first assessment", "It is only for late learners"], "a": 1, "w": "Not completing onboarding means not enrolled."}]}, {"title": "Your programme", "q": [{"t": "Where do you find your programme name, start date and end date?", "o": ["On social media", "From another learner", "On your EduPortal profile and your learnership agreement", "You will be told on the last day"], "a": 2, "w": "Your programme details sit on EduPortal and in your agreement."}, {"t": "Your qualification has an NQF level. What does it tell you?", "o": ["How difficult and advanced the qualification is", "How many learners are in your class", "Your stipend amount", "Which city you study in"], "a": 0, "w": "The NQF level shows how complex the qualification is."}, {"t": "What are credits?", "o": ["Money paid to you", "A measure of the learning time the qualification needs", "Airtime for the virtual classroom", "Bonus marks"], "a": 1, "w": "One credit is about 10 notional hours of learning."}, {"t": "Most programmes have three parts. What are they?", "o": ["Knowledge, practical skills and workplace experience", "Reading, writing and singing", "Exams only", "Online quizzes only"], "a": 0, "w": "Occupational qualifications have knowledge, practical and workplace parts."}, {"t": "What is the timetable for?", "o": ["Only the facilitator uses it", "It is a rough idea and can be ignored", "It is for employers only", "It shows when every class, deadline and assessment happens, so you can plan"], "a": 3, "w": "The timetable is the plan you must follow."}, {"t": "Who teaches your classes?", "o": ["Any EducaSure staff member", "A registered facilitator booked for your programme", "Your employer's manager", "Other learners"], "a": 1, "w": "Only registered facilitators teach. They are booked per programme."}, {"t": "You spend time at your workplace as well as in class. What is it for?", "o": ["To apply what you learn and build evidence for your PoE", "To run errands", "Only to collect your stipend", "It is optional"], "a": 0, "w": "Workplace time is where you apply skills and gather PoE evidence."}, {"t": "Who is your main contact at EducaSure for your cohort?", "o": ["The Managing Director", "The facilitator only", "The SDF Administrator for your cohort", "The QCTO"], "a": 2, "w": "The SDF Administrator for your cohort logs and routes your queries."}, {"t": "Your programme ends with an external exam. What is it called?", "o": ["The matric exam", "The EISA (External Integrated Summative Assessment)", "The SARS test", "The final quiz"], "a": 1, "w": "QCTO qualifications end with an EISA."}, {"t": "If your programme dates change, how will you find out?", "o": ["You won't", "From rumours", "Through official notices on EduPortal and from your SDF Administrator", "Only if you phone every day"], "a": 2, "w": "Changes are communicated officially, never by word of mouth."}]}, {"title": "The documents we need and by when", "q": [{"t": "Why do we need your documents before you start?", "o": ["To keep in a drawer", "To register you with the SETA. Without them you cannot be enrolled or funded", "They are not really needed", "For marketing"], "a": 1, "w": "SETA registration and funding depend on complete documents."}, {"t": "Which of these is usually required?", "o": ["A certified copy of your ID", "Your bank PIN", "Your social media password", "A photo of your house"], "a": 0, "w": "A certified ID copy is a standard registration requirement."}, {"t": "What does \"certified copy\" mean?", "o": ["Any photocopy", "A screenshot", "A copy stamped and signed by a Commissioner of Oaths (e.g. at a police station) as a true copy", "A copy signed by a friend"], "a": 2, "w": "Only a Commissioner of Oaths can certify a copy."}, {"t": "How recent must a certified copy usually be?", "o": ["Any age", "Ten years", "Five years", "Certified within the last 3 months"], "a": 3, "w": "SETAs normally want recent certification."}, {"t": "What else do we normally need besides your ID?", "o": ["Your highest qualification (e.g. matric certificate) and a CV", "Your medical records", "Your parents' payslips", "Nothing else"], "a": 0, "w": "Proof of highest qualification and a CV are standard."}, {"t": "What is the learnership agreement?", "o": ["A loan form", "A signed agreement between you, the employer and the provider, registered with the SETA", "A class register", "A job advert"], "a": 1, "w": "The three-way agreement is registered with the SETA."}, {"t": "When must your documents be submitted?", "o": ["By the date your SDF Administrator gives you, before your first class", "At the end of the programme", "Whenever you have time", "Only if asked twice"], "a": 0, "w": "Documents must be in before the first class."}, {"t": "What happens if your documents are missing or wrong?", "o": ["Nothing", "EducaSure fixes them for you", "Your registration with the SETA can be delayed or rejected, and you may not be enrolled", "You get extra marks"], "a": 2, "w": "Incomplete packs delay or block registration."}, {"t": "How should you send your documents?", "o": ["On a public WhatsApp group", "Through the official channel your SDF Administrator gives you (e.g. EduPortal upload)", "On Facebook", "Through a classmate"], "a": 1, "w": "Personal information is POPIA-protected. Use the official channel only."}, {"t": "Your contact  "Someone else doing your work", "A fine"], "a": 0, "w": "A catch-up plan sets out what is owed, by when, and with what support."}, {"t": "Your SDF Administrator contacts you about missing work. What must you do?", "o": ["Ignore the message", "Block the number", "Reply only after a month", "Respond promptly and follow the agreed plan"], "a": 3, "w": "You must engage with follow-ups."}, {"t": "What can happen if you keep falling behind and don't respond?", "o": ["Nothing", "Formal warnings, and your learnership agreement may be terminated", "Automatic pass", "A free extension forever"], "a": 1, "w": "Persistent non-engagement leads to formal steps."}, {"t": "Your personal circumstances change (illness, family, transport). What should you do?", "o": ["Tell your SDF Administrator so the options can be discussed", "Say nothing", "Post on social media", "Stop attending without notice"], "a": 0, "w": "Options exist only if EducaSure knows about your situation."}, {"t": "If your PoE is incomplete, can you write the EISA?", "o": ["Yes, always", "Only on Fridays", "No — you won't be found ready for the EISA until it is complete", "Only if a friend vouches for you"], "a": 2, "w": "EISA readiness requires a complete PoE."}, {"t": "Why does falling behind affect more than just you?", "o": ["It doesn't", "Only the facilitator is affected", "It only affects your stipend", "Funding and cohort deadlines (e.g. EISA readiness) depend on every learner progressing"], "a": 3, "w": "Cohort funding and deadlines depend on every learner."}, {"t": "When is the best time to ask for help?", "o": ["After the programme ends", "As soon as you notice a problem", "Only before the EISA", "Never"], "a": 1, "w": "Most problems start in the first two weeks. Act early."}]}];
const PASS=8;
const L='ABCD';
let st={name:'',res:{}}; // res[mi]={score,passed}
try{const s=JSON.parse(localStorage.getItem('es_onb')||'null');if(s)st=s}catch(e){}
function save(){try{localStorage.setItem('es_onb',JSON.stringify(st))}catch(e){}}
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function passedCount(){return MODULES.filter((m,i)=>st.res[i]&&st.res[i].passed).length}

function home(){
  const done=passedCount();
  app.innerHTML=`
  <div class="banner"><div class="eyebrow">Learner onboarding · Practice quizzes</div>
  <h1>Welcome to EducaSure</h1><p>Eight short quizzes, one per module. Read the study guide first, then test yourself here.</p></div>
  <div class="tiles"><div class="tile"><div class="k">Pass mark</div><div class="v">8 / 10</div></div>
  <div class="tile"><div class="k">Attempts</div><div class="v">Unlimited</div></div>
  <div class="tile"><div class="k">Passed</div><div class="v">${done} of 8</div></div></div>
  <div class="name"><label for="nm">Your full name</label><input id="nm" value="${esc(st.name)}" placeholder="As it appears on your ID"></div>
  <h2>Choose a module</h2>
  <div class="list">${MODULES.map((m,i)=>{const r=st.res[i];const p=r?(r.passed?`<span class="pill pass">Passed ${r.score}/10</span>`:`<span class="pill fail">Retake ${r.score}/10</span>`):`<span class="pill todo">Not started</span>`;
    return `<button class="mod" data-i="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="t">${esc(m.title)}</span>${p}</button>`}).join('')}</div>
  ${done===8?`<div class="box"><div class="t">All modules passed</div>Well done. <a href="#" id="certlink">View your completion summary</a>.</div>`:''}
`;
  const nm=document.getElementById('nm');nm.oninput=()=>{st.name=nm.value;save()};
  app.querySelectorAll('.mod').forEach(b=>b.onclick=()=>quiz(+b.dataset.i));
  const cl=document.getElementById('certlink');if(cl)cl.onclick=e=>{e.preventDefault();cert()};
  window.scrollTo(0,0);
}

function quiz(mi){
  const m=MODULES[mi];
  const qs=m.q.map(q=>({...q,order:shuffle([0,1,2,3])}));
  const ans=new Array(qs.length).fill(null);
  function render(){
    const n=ans.filter(a=>a!==null).length;
    app.innerHTML=`<div class="noprint"><button class="btn alt" id="back">← All modules</button></div>
    <h2><span class="n">${String(mi+1).padStart(2,'0')}</span>${esc(m.title)}</h2>
    <p class="sans" style="color:var(--muted);font-size:14px;margin:0">Answer all 10 questions, then submit. You need 8 right to pass.</p>
    ${qs.map((q,qi)=>`<div class="q"><div class="qh">Question ${qi+1} of ${qs.length}</div><div class="qt">${esc(q.t)}</div>
      ${q.order.map((oi,pos)=>`<button class="opt ${ans[qi]===oi?'sel':''}" data-q="${qi}" data-o="${oi}"><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`).join('')}
    <div class="bar"><span class="prog">${n} of ${qs.length} answered</span><button class="btn" id="sub" ${n<qs.length?'disabled':''}>Submit answers</button></div>`;
    document.getElementById('back').onclick=home;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[+b.dataset.q]=+b.dataset.o;const y=window.scrollY;render();window.scrollTo(0,y)});
    document.getElementById('sub').onclick=()=>results();
  }
  function results(){
    const score=qs.reduce((s,q,i)=>s+(ans[i]===q.a?1:0),0), passed=score>=PASS;
    const prev=st.res[mi];
    if(prev&&prev.passed){ if(score>prev.score) st.res[mi]={score,passed:true}; }
    else st.res[mi]={score,passed};
    save();
    app.innerHTML=`<div class="noprint"><button class="btn alt" id="back">← All modules</button></div>
    <h2><span class="n">${String(mi+1).padStart(2,'0')}</span>${esc(m.title)}</h2>
    <div class="result ${passed?'ok':'no'}"><div class="verdict">${passed?'Passed':'Not yet. Try again'}</div>
    <div class="score">${score} / 10</div><p>${passed?'Well done. You can move on to the next module.':'You need 8 to pass. Read the feedback below, check the study guide, and retake the quiz.'}</p></div>
    ${qs.map((q,qi)=>{const ok=ans[qi]===q.a;return `<div class="q"><div class="qh">Question ${qi+1}</div><div class="qt">${esc(q.t)}</div>
      ${q.order.map((oi,pos)=>{let c='';if(oi===q.a)c='right';else if(oi===ans[qi])c='wrong';return `<button class="opt ${c}" disabled><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`}).join('')}
      <div class="fb ${ok?'':'no'}"><b>${ok?'Correct.':'Not quite.'}</b> ${esc(q.w)}</div></div>`}).join('')}
    <div class="bar">${passed&&mi<7?`<button class="btn" id="next">Next module →</button>`:''}<button class="btn ${passed?'alt':''}" id="retry">Retake this quiz</button>${passedCount()===8?`<button class="btn gold" id="c">Completion summary</button>`:''}</div>`;
    document.getElementById('back').onclick=home;
    document.getElementById('retry').onclick=()=>quiz(mi);
    const nx=document.getElementById('next');if(nx)nx.onclick=()=>quiz(mi+1);
    const c=document.getElementById('c');if(c)c.onclick=cert;
    window.scrollTo(0,0);
  }
  render();window.scrollTo(0,0);
}

function cert(){
  const d=new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'});
  app.innerHTML=`<div class="noprint"><button class="btn alt" id="back">← All modules</button></div>
  <div class="cert"><img src="${LOGO}" alt="EducaSure"><div class="eyebrow">Practice completion summary</div>
  <h3>Learner Onboarding</h3><div>This confirms that</div><div class="nm">${esc(st.name||'Learner')}</div>
  <div>passed all eight onboarding practice quizzes on ${d}.</div>
  <table style="margin:14px auto 0;border-collapse:collapse;font-size:14px;text-align:left">${MODULES.map((m,i)=>`<tr><td style="padding:3px 10px;color:var(--gold);font-weight:700">${String(i+1).padStart(2,'0')}</td><td style="padding:3px 10px">${esc(m.title)}</td><td style="padding:3px 10px;font-weight:700">${st.res[i].score}/10</td></tr>`).join('')}</table>
  <p style="font-size:13px;color:var(--muted);margin-top:14px">Practice result only. Your official certificate is issued on EduPortal.</p></div>
  <div class="noprint"><button class="btn" onclick="window.print()">Print or save as PDF</button></div>`;
  document.getElementById('back').onclick=home;window.scrollTo(0,0);
}
home();
</script>
</body></html>
